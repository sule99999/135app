function WrapUpModal({plan, plans, streak, onClose, onPlanTomorrow}){
  const tasks=planTasks(plan);
  const done=tasks.filter(t=>t.status==='completed');
  const totalMins=done.reduce((s,t)=>s+(t.actualMinutes||t.estimatedMinutes||0),0);
  const hrs=Math.floor(totalMins/60), mins=totalMins%60;
  const timeStr=hrs>0?`${hrs}h ${mins}m`:`${mins}m`;
  const allDone=done.length===tasks.length&&tasks.length>0;
  const days=Object.keys(plans).sort();
  const allT=days.flatMap(d=>planTasks(plans[d]));
  const doneT=allT.filter(t=>t.status==='completed');
  const mxStrk=calcMaxStreak(plans);
  const stats={
    active:days.length,totalDone:doneT.length,
    goldDone:doneT.filter(t=>t.tier==='gold').length,
    silverFull:days.filter(d=>{const p=plans[d];return p&&p.silverTasks.length>0&&p.silverTasks.every(t=>t.status==='completed');}).length,
    perfect:days.filter(d=>{const p=plans[d];if(!p)return false;const a=planTasks(p);return a.length>0&&a.every(t=>t.status==='completed');}).length,
    maxStreak:mxStrk, streak, onTime:doneT.filter(t=>t.actualMinutes&&t.actualMinutes<=t.estimatedMinutes).length,
    early:doneT.filter(t=>t.actualMinutes&&t.actualMinutes<t.estimatedMinutes*0.9).length,
  };
  const insights=generateInsights(plans,stats);
  const pick=insights[0];
  return(
    <div className="wrapup-overlay" onClick={onClose}>
      <div className="wrapup-modal" onClick={e=>e.stopPropagation()}>
        <div className="wrapup-hero">
          <span className="wrapup-emoji">{allDone?'🌟':'🌙'}</span>
          <div className="wrapup-title">{allDone?'完美收工！':'今日收工'}</div>
          <div className="wrapup-date">{allDone?'所有任务全部完成，太棒了！':'今天辛苦了，明天继续加油！'}</div>
        </div>
        <div className="wrapup-stats">
          <div className="wrapup-stat">
            <div className="wrapup-stat-val" style={{color:'var(--gold)'}}>{done.length}<span style={{fontSize:13,fontWeight:500}}>/{tasks.length}</span></div>
            <div className="wrapup-stat-lbl">任务完成</div>
          </div>
          <div className="wrapup-stat">
            <div className="wrapup-stat-val" style={{color:'var(--success)'}}>{timeStr}</div>
            <div className="wrapup-stat-lbl">专注时长</div>
          </div>
          <div className="wrapup-stat">
            <div className="wrapup-stat-val" style={{color:'#FF9500'}}>{streak}<span style={{fontSize:11}}>天</span></div>
            <div className="wrapup-stat-lbl">🔥 连击</div>
          </div>
        </div>
        {pick&&<div className="wrapup-insight">
          <span className="wrapup-insight-emoji">{pick.emoji}</span>
          <span className="wrapup-insight-text">{pick.text}</span>
        </div>}
        <button className="wrapup-close" onClick={onPlanTomorrow||onClose}>🌅 收好今天，迎接明天</button>
        <button className="wrapup-continue" onClick={onClose}>继续今天</button>
      </div>
    </div>
  );
}

function DataReview({plans}){
  const [tab,setTab]=useState('overview');
  const days=useMemo(()=>Object.keys(plans).sort(),[plans]);
  const allT=useMemo(()=>days.flatMap(d=>planTasks(plans[d])),[days,plans]);
  const doneT=useMemo(()=>allT.filter(t=>t.status==='completed'),[allT]);
  const streak=useMemo(()=>calcStreak(plans),[plans]);
  const mxStrk=useMemo(()=>calcMaxStreak(plans),[plans]);
  const stats=useMemo(()=>({
    active:days.length, totalDone:doneT.length,
    goldDone:doneT.filter(t=>t.tier==='gold').length,
    silverFull:days.filter(d=>{ const p=plans[d]; return p&&p.silverTasks.length>0&&p.silverTasks.every(t=>t.status==='completed'); }).length,
    perfect:days.filter(d=>{ const p=plans[d]; if(!p) return false; const a=planTasks(p); return a.length>0&&a.every(t=>t.status==='completed'); }).length,
    maxStreak:mxStrk,
    onTime:doneT.filter(t=>t.actualMinutes&&t.actualMinutes<=t.estimatedMinutes).length,
    early: doneT.filter(t=>t.actualMinutes&&t.actualMinutes<t.estimatedMinutes*0.9).length,
  }),[days,plans,doneT,mxStrk]);

  const HeatMap=()=>{
    const cells=[]; const now=new Date();
    for(let i=69;i>=0;i--){const d=new Date(now);d.setDate(d.getDate()-i);const k=d.toISOString().split('T')[0],p=plans[k];const n=p?planTasks(p).filter(t=>t.status==='completed').length:0;const lvl=n>=9?4:n>=6?3:n>=3?2:n>=1?1:0;cells.push({k,lvl});}
    return(<div className="review-card"><div className="review-card-title">📅 活跃热力图（近70天）</div>
      <div className="heatmap">{cells.map((c,i)=><div key={i} className={`hm-cell${c.lvl>0?` hm-${c.lvl}`:''}`} title={c.k}/>)}</div>
      <div className="hm-legend"><span>少</span>{[0,1,2,3,4].map(l=><div key={l} className="hm-sw" style={{background:l===0?'var(--chip-bg)':`rgba(200,144,10,${l*.2+.1})`}}/>)}<span>多</span></div>
    </div>);
  };

  const BarChart=()=>{
    const rows=[]; const now=new Date();
    for(let i=6;i>=0;i--){const d=new Date(now);d.setDate(d.getDate()-i);const k=d.toISOString().split('T')[0],p=plans[k],ts=p?planTasks(p):[];
      const pl=ts.reduce((s,t)=>s+(t.estimatedMinutes||0),0),ac=ts.filter(t=>t.status==='completed').reduce((s,t)=>s+(t.actualMinutes||0),0);
      rows.push({lbl:`周${'日一二三四五六'[d.getDay()]}`,plan:pl,act:ac});}
    const mx=Math.max(...rows.flatMap(r=>[r.plan,r.act]),60);
    return(<div className="review-card"><div className="review-card-title">📊 近7天时间对比（分钟）</div>
      <div className="bar-chart-wrap">{rows.map((r,i)=>(<div key={i} className="bar-grp"><div className="bar bar-plan" style={{height:`${(r.plan/mx)*70}px`}}/><div className="bar bar-act" style={{height:`${(r.act/mx)*70}px`}}/><span className="bar-lbl">{r.lbl}</span></div>))}</div>
      <div className="chart-legend"><span><span className="legend-sw" style={{background:'var(--gold-bg)',border:'1px solid var(--gold-border)'}}/>计划</span><span><span className="legend-sw" style={{background:'var(--gold)',opacity:.85}}/>实际</span></div>
    </div>);
  };

  const WeeklySummary=()=>{
    // 计算指定日期所在周的一系列天（周一~周日）
    const getWeekDays=(refDate)=>{
      const d=new Date(refDate+' 12:00');
      const day=d.getDay(); // 0=周日
      const monday=new Date(d); monday.setDate(d.getDate()-(day===0?6:day-1));
      return Array.from({length:7},(_,i)=>{ const x=new Date(monday); x.setDate(monday.getDate()+i); return x.toISOString().split('T')[0]; });
    };
    const now=new Date();
    const todayK=now.toISOString().split('T')[0];
    const thisWeekDays=getWeekDays(todayK);
    const lastWeekStart=new Date(thisWeekDays[0]+' 12:00'); lastWeekStart.setDate(lastWeekStart.getDate()-7);
    const lastWeekDays=getWeekDays(lastWeekStart.toISOString().split('T')[0]);
    const weekStats=(weekDays)=>{
      const ts=weekDays.flatMap(d=>planTasks(plans[d]||{}));
      const done=ts.filter(t=>t.status==='completed');
      const focusMins=done.reduce((s,t)=>s+(t.actualMinutes||t.estimatedMinutes||0),0);
      const goldDone=done.filter(t=>t.tier==='gold').length;
      const activeDays=weekDays.filter(d=>plans[d]&&planTasks(plans[d]).length>0).length;
      const perfectDays=weekDays.filter(d=>{const p=plans[d];if(!p)return false;const a=planTasks(p);return a.length>0&&a.every(t=>t.status==='completed');}).length;
      const rate=ts.length?Math.round(done.length/ts.length*100):0;
      return{ts,done,focusMins,goldDone,activeDays,perfectDays,rate,total:ts.length};
    };
    const thisW=weekStats(thisWeekDays);
    const lastW=weekStats(lastWeekDays);
    const dayNames=['周一','周二','周三','周四','周五','周六','周日'];
    // 本周每日情况
    const dayRows=thisWeekDays.map((d,i)=>{
      const p=plans[d]; const ts=p?planTasks(p):[];
      const done=ts.filter(t=>t.status==='completed');
      const isPast=d<=todayK;
      const isToday=d===todayK;
      const rate=ts.length?Math.round(done.length/ts.length*100):null;
      const allDone=ts.length>0&&done.length===ts.length;
      return{d,i,ts,done,rate,isPast,isToday,allDone,empty:!p||ts.length===0};
    });
    // 本周完成的 Top 任务（按层级排序：金>银>铜）
    const tierOrder={gold:0,silver:1,bronze:2};
    const topTasks=thisW.done.slice().sort((a,b)=>(tierOrder[a.tier]||2)-(tierOrder[b.tier]||2)).slice(0,5);
    const diff=(a,b)=>a-b;
    const arrow=(a,b)=>a>b?'↑':a<b?'↓':'—';
    const arrowColor=(a,b)=>a>b?'var(--success)':a<b?'var(--danger)':'var(--text-secondary)';
    const fmt=m=>m>=60?`${Math.floor(m/60)}h${m%60?m%60+'m':''}`:`${m}m`;
    // 本周起止日期
    const wkStart=new Date(thisWeekDays[0]+' 12:00');
    const wkEnd=new Date(thisWeekDays[6]+' 12:00');
    const fmtMD=d=>`${d.getMonth()+1}月${d.getDate()}日`;
    if(thisW.activeDays===0 && lastW.activeDays===0)
      return(<div className="empty-state"><div className="empty-icon">📅</div><div className="empty-title">暂无数据</div><div className="empty-text">开始记录任务后，这里将展示每周回顾</div></div>);
    return(
      <div>
        {/* 本周标题 */}
        <div style={{textAlign:'center',marginBottom:14}}>
          <div style={{fontSize:13,color:'var(--text-secondary)',marginBottom:2}}>{fmtMD(wkStart)} – {fmtMD(wkEnd)}</div>
          <div style={{fontSize:18,fontWeight:800,color:'var(--text-primary)'}}>本周回顾</div>
        </div>
        {/* 核心数字 */}
        <div className="stats-grid" style={{marginBottom:11}}>
          <div className="stat-tile">
            <span className="stat-val" style={{color:'var(--gold)'}}>{thisW.done.length}</span>
            <div className="stat-lbl">✅ 任务完成</div>
            <div style={{fontSize:10,marginTop:3,color:arrowColor(thisW.done.length,lastW.done.length)}}>
              {arrow(thisW.done.length,lastW.done.length)} 上周{lastW.done.length}个
            </div>
          </div>
          <div className="stat-tile">
            <span className="stat-val" style={{color:'var(--success)'}}>{fmt(thisW.focusMins)}</span>
            <div className="stat-lbl">⏱ 专注时长</div>
            <div style={{fontSize:10,marginTop:3,color:arrowColor(thisW.focusMins,lastW.focusMins)}}>
              {arrow(thisW.focusMins,lastW.focusMins)} 上周{fmt(lastW.focusMins)}
            </div>
          </div>
          <div className="stat-tile">
            <span className="stat-val" style={{color:'var(--gold)'}}>{thisW.rate}%</span>
            <div className="stat-lbl">📈 完成率</div>
            <div style={{fontSize:10,marginTop:3,color:arrowColor(thisW.rate,lastW.rate)}}>
              {arrow(thisW.rate,lastW.rate)} 上周{lastW.rate}%
            </div>
          </div>
        </div>
        <div className="stats-grid" style={{marginBottom:14}}>
          <div className="stat-tile"><span className="stat-val" style={{color:'var(--gold)'}}>{thisW.goldDone}</span><div className="stat-lbl">🥇 金牌完成</div></div>
          <div className="stat-tile"><span className="stat-val" style={{color:'#FF9500'}}>{thisW.activeDays}</span><div className="stat-lbl">📅 活跃天数</div></div>
          <div className="stat-tile"><span className="stat-val" style={{color:'var(--success)'}}>{thisW.perfectDays}</span><div className="stat-lbl">🌟 完美天数</div></div>
        </div>
        {/* 每日打卡条 */}
        <div className="review-card" style={{marginBottom:11}}>
          <div className="review-card-title">每日完成情况</div>
          <div style={{display:'flex',gap:6}}>
            {dayRows.map((r,i)=>(
              <div key={r.d} style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',gap:4}}>
                <div style={{width:'100%',height:44,borderRadius:8,display:'flex',alignItems:'center',justifyContent:'center',fontSize:16,
                  background:r.empty&&r.isPast?'var(--chip-bg)':r.allDone?'rgba(61,220,132,0.18)':r.rate!=null?`rgba(255,215,0,${Math.max(.08,r.rate/100*.35)})`:'var(--chip-bg)',
                  border:`1.5px solid ${r.isToday?'var(--gold)':r.allDone?'rgba(61,220,132,0.5)':r.rate!=null?'rgba(255,215,0,0.3)':'var(--chip-border)'}`,
                  opacity:r.isPast||r.isToday?1:0.4}}>
                  {r.empty&&r.isPast?'—':r.allDone?'🌟':r.rate!=null?`${r.rate}%`:''}
                </div>
                <div style={{fontSize:10,color:r.isToday?'var(--gold)':'var(--text-secondary)',fontWeight:r.isToday?700:400}}>{dayNames[i]}</div>
              </div>
            ))}
          </div>
        </div>
        {/* 本周完成的任务 */}
        {topTasks.length>0&&(
          <div className="review-card" style={{marginBottom:11}}>
            <div className="review-card-title">🏆 本周完成的任务</div>
            {topTasks.map((t,i)=>(
              <div key={i} style={{display:'flex',alignItems:'center',gap:8,padding:'7px 0',borderBottom:i<topTasks.length-1?'1px solid var(--subtle-border)':'none'}}>
                <span style={{fontSize:16}}>{t.tier==='gold'?'🥇':t.tier==='silver'?'🥈':'🥉'}</span>
                <span style={{flex:1,fontSize:13,color:'var(--text-primary)',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{t.title}</span>
                {t.actualMinutes>0&&<span style={{fontSize:11,color:'var(--text-secondary)',flexShrink:0}}>{t.actualMinutes}min</span>}
              </div>
            ))}
          </div>
        )}
        {/* 鼓励语 */}
        <div style={{padding:'13px 14px',borderRadius:12,background:'rgba(255,215,0,0.06)',border:'1px solid rgba(255,215,0,0.2)',textAlign:'center'}}>
          <div style={{fontSize:22,marginBottom:6}}>
            {thisW.rate>=100?'🎉':thisW.rate>=80?'🌟':thisW.rate>=50?'💪':'🌱'}
          </div>
          <div style={{fontSize:13,color:'var(--text-primary)',fontWeight:600,lineHeight:1.6}}>
            {thisW.rate>=100?'完美一周！所有任务全部完成，太厉害了！'
             :thisW.rate>=80?`表现出色！完成率 ${thisW.rate}%，继续保持！`
             :thisW.rate>=50?`不错的一周，完成了 ${thisW.done.length} 个任务，下周继续加油！`
             :thisW.activeDays>0?`播下了 ${thisW.activeDays} 天的种子，积累总比停止好。`
             :'新的一周，新的开始，加油！💫'}
          </div>
        </div>
      </div>
    );
  };

  const MonthlySummary=()=>{
    const mths={}; days.forEach(d=>{ const m=d.slice(0,7); if(!mths[m])mths[m]=[]; mths[m].push(d); });
    const list=Object.entries(mths).sort((a,b)=>b[0].localeCompare(a[0])).slice(0,12);
    if(!list.length) return(<div className="empty-state"><div className="empty-icon">📅</div><div className="empty-title">暂无数据</div><div className="empty-text">使用满一个月后，这里将显示月度总结</div></div>);
    return(<div className="review-card"><div className="review-card-title">🗓️ 月度总结</div>
      <table className="sum-table"><thead><tr><th>月份</th><th>活跃</th><th>完成</th><th>金牌率</th><th>准时率</th></tr></thead>
      <tbody>{list.map(([m,ds])=>{const ts=ds.flatMap(d=>planTasks(plans[d]));const dn=ts.filter(t=>t.status==='completed');const gl=ts.filter(t=>t.tier==='gold').length;const gr=gl?Math.round(dn.filter(t=>t.tier==='gold').length/gl*100):0;const otr=dn.length?Math.round(dn.filter(t=>t.actualMinutes&&t.actualMinutes<=t.estimatedMinutes).length/dn.length*100):0;const[y,mo]=m.split('-');return(<tr key={m}><td style={{color:'var(--gold)'}}>{y}年{parseInt(mo)}月</td><td>{ds.length}天</td><td>{dn.length}</td><td><span style={{color:gr>=80?'var(--success)':'var(--gold)'}}>{gr}%</span></td><td><span style={{color:otr>=70?'var(--success)':'var(--danger)'}}>{otr}%</span></td></tr>);})}</tbody>
      </table></div>);
  };

  const InsightCard=()=>{
    const insights=generateInsights(plans,stats);
    return(<div className="insight-card">
      <div className="insight-card-title">💡 专属洞察</div>
      {insights.slice(0,3).map((ins,i)=>(
        <div key={i} className={`insight-strip type-${ins.type}`}>
          <span className="insight-strip-emoji">{ins.emoji}</span>
          <span className="insight-strip-text">{ins.text}</span>
        </div>
      ))}
    </div>);
  };

  const Badges=()=>{
    const levelNames=['未解锁','🥉 青铜','🥈 白银','🥇 黄金','👑 传奇'];
    return(<div className="review-card"><div className="review-card-title">🏅 成就勋章</div>
      <div className="badge-grid">{TIERED_BADGES.map(b=>{
        const v=b.val(stats);
        let lvl=0;
        b.levels.forEach((l,i)=>{ if(v>=l.t) lvl=i+1; });
        const atMax=lvl>=b.levels.length;
        const nextL=atMax?null:b.levels[lvl];
        const prevT=lvl>0?b.levels[lvl-1].t:0;
        const prog=nextL?Math.min(100,Math.round((v-prevT)/(nextL.t-prevT)*100)):100;
        return(
          <div key={b.id} className={`badge-row lvl-${lvl}${lvl>0?' lvl-active':''}`}>
            <div className="badge-row-icon" style={{filter:lvl===0?'grayscale(1)':'none',opacity:lvl===0?.35:1}}>{b.emoji}</div>
            <div className="badge-row-body">
              <div className="badge-row-top">
                <span className="badge-row-name">{b.name}</span>
                <span className="badge-row-level">{lvl===0?'未解锁':levelNames[lvl]}</span>
              </div>
              <div className="badge-prog-track">
                <div className="badge-prog-fill" style={{width:`${prog}%`}}/>
              </div>
              <div className="badge-prog-hint">
                {atMax?`🎉 已达传奇，当前 ${v} ${b.desc.replace('累计','').trim()}`:
                 `${b.desc} ${v} / ${nextL.t}，距「${nextL.name}」还差 ${nextL.t-v}`}
              </div>
            </div>
          </div>
        );
      })}</div>
    </div>);
  };

  return(<div className="review-wrap">
    <div className="review-top"><h2>📊 数据复盘</h2><p>了解你的时间都去哪了</p></div>
    <div className="review-tabs">{[{id:'overview',l:'概览'},{id:'weekly',l:'周回顾'},{id:'monthly',l:'每月'},{id:'badges',l:'勋章'}].map(t=>(<button key={t.id} className={`rtab${tab===t.id?' active':''}`} onClick={()=>setTab(t.id)}>{t.l}</button>))}</div>
    {tab==='overview'&&(<><InsightCard/><div className="stats-grid">
      <div className="stat-tile"><span className="stat-val" style={{color:'#FF9500'}}>{streak}</span><div className="stat-lbl">🔥 连续打卡</div></div>
      <div className="stat-tile"><span className="stat-val" style={{color:'var(--gold)'}}>{stats.totalDone}</span><div className="stat-lbl">✅ 累计完成</div></div>
      <div className="stat-tile"><span className="stat-val" style={{color:'var(--success)'}}>{stats.perfect}</span><div className="stat-lbl">🌟 完美天数</div></div>
    </div><div className="stats-grid">
      <div className="stat-tile"><span className="stat-val" style={{color:'var(--gold)'}}>{stats.goldDone}</span><div className="stat-lbl">🥇 金牌完成</div></div>
      <div className="stat-tile"><span className="stat-val" style={{color:'var(--silver)'}}>{stats.onTime}</span><div className="stat-lbl">⏰ 准时完成</div></div>
      <div className="stat-tile"><span className="stat-val" style={{color:'var(--success)'}}>{stats.early}</span><div className="stat-lbl">🚀 提前完成</div></div>
    </div><HeatMap/><BarChart/></>)}
    {tab==='weekly' &&<WeeklySummary/>}{tab==='monthly'&&<MonthlySummary/>}{tab==='badges'&&<Badges/>}
  </div>);
}

// ── ADD / EDIT EVENT MODAL ────────────────────────────
function AddEventModal({initialDate, event:editEvt, onSave, onDelete, onClose}){
  const isEdit=!!editEvt;
  const [title,setTitle]=useState(isEdit?editEvt.title:'');
  const [date,setDate]=useState(isEdit?editEvt.date:(initialDate||todayStr()));
  const [allDay,setAllDay]=useState(isEdit?!!editEvt.allDay:false);
  const [startT,setStartT]=useState(isEdit?(editEvt.startTime||'09:00'):'09:00');
  const [endT,setEndT]=useState(isEdit?(editEvt.endTime||'10:00'):'10:00');
  const [color,setColor]=useState(isEdit?(editEvt.color||'blue'):'blue');
  const [notes,setNotes]=useState(isEdit?(editEvt.notes||''):'');

  const save=()=>{
    if(!title.trim()) return;
    const id=isEdit?editEvt.id:genId();
    onSave({id,title:title.trim(),date,allDay,startTime:allDay?null:startT,endTime:allDay?null:endT,color,notes:notes.trim()||null});
    onClose();
  };
  const handleDelete=()=>{
    if(window.confirm(`删除「${title}」？`)){onDelete(editEvt.id);onClose();}
  };

  return(<div className="overlay" onClick={onClose}>
    <div className="modal-box modal-welcome" style={{maxWidth:400}} onClick={e=>e.stopPropagation()}>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:3}}>
        <div style={{fontSize:16,fontWeight:700,color:'var(--text-primary)'}}>{isEdit?'✏️ 编辑日历事件':'📅 添加日历事件'}</div>
        {isEdit&&<button onClick={handleDelete} style={{background:'none',border:'none',cursor:'pointer',fontSize:18,padding:'2px 4px',color:'var(--danger)',opacity:.75}} title="删除事件">🗑️</button>}
      </div>
      <div style={{fontSize:11,color:'var(--text-secondary)',marginBottom:15}}>{isEdit?'修改事件信息后保存':'记录计划、提醒或任何事项'}</div>

      <div className="form-group"><label className="form-label">标题</label>
        <input className="form-input" placeholder="事件名称…" value={title} onChange={e=>setTitle(e.target.value)} onKeyDown={e=>e.key==='Enter'&&save()} autoFocus/>
      </div>
      <div className="form-group"><label className="form-label">日期</label>
        <input className="form-input form-input-sm" type="date" value={date} onChange={e=>setDate(e.target.value)}/>
      </div>

      <div className="form-group" style={{display:'flex',alignItems:'center',gap:10}}>
        <label style={{fontSize:13,color:'var(--text-primary)',cursor:'pointer',display:'flex',alignItems:'center',gap:6,userSelect:'none'}}>
          <input type="checkbox" checked={allDay} onChange={e=>setAllDay(e.target.checked)} style={{width:15,height:15,accentColor:'var(--gold)'}}/>
          全天事件
        </label>
      </div>

      {!allDay&&(<div className="form-group"><label className="form-label">时间段</label>
        <div className="time-row">
          <input className="form-input form-input-sm" type="time" value={startT} onChange={e=>setStartT(e.target.value)} style={{flex:1}}/>
          <span>至</span>
          <input className="form-input form-input-sm" type="time" value={endT} onChange={e=>setEndT(e.target.value)} style={{flex:1}}/>
        </div>
      </div>)}

      <div className="form-group"><label className="form-label">颜色</label>
        <div className="color-picker">
          {Object.entries(EVENT_COLORS).map(([k,c])=>(
            <div key={k} className={`color-dot${color===k?' selected':''}`}
              style={{background:c.hex}} title={COLOR_LABELS[k]}
              onClick={()=>setColor(k)}/>
          ))}
        </div>
      </div>
      <div className="form-group"><label className="form-label">备注（可选）</label>
        <input className="form-input form-input-sm" placeholder="备注…" value={notes} onChange={e=>setNotes(e.target.value)}/>
      </div>

      <button className="btn btn-gold" disabled={!title.trim()} onClick={save}>{isEdit?'保存修改':'保存事件'}</button>
      <button className="btn btn-ghost" onClick={onClose}>取消</button>
    </div>
  </div>);
}

// ── CALENDAR VIEW ────────────────────────────────────
function CalendarView({plans, events, onAddEvent, onDeleteEvent}){
  const [view,setView]=useState('month');
  const [curYear,setCurYear]=useState(new Date().getFullYear());
  const [curMonth,setCurMonth]=useState(new Date().getMonth());
  const [selDate,setSelDate]=useState(todayStr());
  const [showAdd,setShowAdd]=useState(false);
  const [editingEvent,setEditingEvent]=useState(null);

  const today=todayStr();

  // Navigate months
  const prevMonth=()=>{ if(curMonth===0){setCurYear(y=>y-1);setCurMonth(11);}else setCurMonth(m=>m-1); };
  const nextMonth=()=>{ if(curMonth===11){setCurYear(y=>y+1);setCurMonth(0);}else setCurMonth(m=>m+1); };
  const goToday=()=>{ const n=new Date(); setCurYear(n.getFullYear()); setCurMonth(n.getMonth()); setSelDate(todayStr()); };

  // Navigate days (in day view)
  const shiftDay=(delta)=>{
    const d=new Date(selDate+'T12:00:00');
    d.setDate(d.getDate()+delta);
    setSelDate(d.toISOString().split('T')[0]);
  };

  // Build month grid
  const monthGrid=useMemo(()=>{
    const firstDay=new Date(curYear,curMonth,1).getDay();
    const daysInMonth=new Date(curYear,curMonth+1,0).getDate();
    const startOffset=firstDay===0?6:firstDay-1; // Monday start
    const cells=[];
    // Previous month days
    const prevDays=new Date(curYear,curMonth,0).getDate();
    for(let i=startOffset-1;i>=0;i--){
      const d=new Date(curYear,curMonth-1,prevDays-i);
      cells.push({date:d.toISOString().split('T')[0],inMonth:false});
    }
    // Current month
    for(let d=1;d<=daysInMonth;d++){
      const dt=new Date(curYear,curMonth,d);
      cells.push({date:dt.toISOString().split('T')[0],inMonth:true});
    }
    // Next month fill
    while(cells.length%7!==0){
      const d=new Date(curYear,curMonth+1,cells.length-daysInMonth-startOffset+1);
      cells.push({date:d.toISOString().split('T')[0],inMonth:false});
    }
    return cells;
  },[curYear,curMonth]);

  const MONTH_NAMES=['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
  const DAY_LABELS=['一','二','三','四','五','六','日'];

  // Timeline for selected date
  const timelineEvts=useMemo(()=>getTimelineEvents(selDate,plans,events),[selDate,plans,events]);
  const alldayEvts=timelineEvts.filter(e=>e.allDay);
  const timedEvts=timelineEvts.filter(e=>!e.allDay);

  // Compute event positions (simple, no overlap detection)
  const HOUR_H=56;
  const evtBlocks=timedEvts.map(e=>{
    const startMin=e.startH*60+e.startM;
    const endMin=e.endH*60+e.endM;
    const dur=Math.max(endMin-startMin,20);
    return {...e, top:startMin*(HOUR_H/60), height:Math.max(dur*(HOUR_H/60),24)};
  });

  const MonthView=()=>(
    <div>
      <div className="cal-month-header">
        <button className="cal-nav-btn" onClick={prevMonth}>‹</button>
        <div className="cal-month-title">{curYear}年 {MONTH_NAMES[curMonth]}</div>
        <button className="cal-today-btn" onClick={goToday}>今天</button>
        <button className="cal-nav-btn" onClick={nextMonth}>›</button>
      </div>
      <div className="cal-days-row">
        {DAY_LABELS.map(d=>(<div key={d} className="cal-day-label">{d}</div>))}
      </div>
      <div className="cal-grid">
        {monthGrid.map(cell=>{
          const dots=getDayDots(cell.date,plans,events);
          const isToday=cell.date===today;
          const isSel=cell.date===selDate;
          return(
            <div key={cell.date} className={`cal-cell${!cell.inMonth?' other-month':''}${isToday?' today':''}${isSel?' selected':''}`}
              onClick={()=>{setSelDate(cell.date);setView('day');}}>
              <div className="cal-date-num">
                {parseInt(cell.date.split('-')[2])}
              </div>
              {dots.length>0&&(
                <div className="cal-dots">
                  {dots.map((c,i)=>(<div key={i} className={`cal-dot ec-${c}`}/>))}
                </div>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );

  const DayView=()=>{
    const fmtHour=h=>h===0?'0:00':h<10?`${h}:00`:`${h}:00`;
    // Scroll to first event or 8am
    const scrollRef=useRef(null);
    useEffect(()=>{
      if(scrollRef.current){
        const firstEvt=timedEvts.length>0?Math.min(...timedEvts.map(e=>e.startH)):8;
        const scrollTo=Math.max(0,(firstEvt-1)*HOUR_H);
        scrollRef.current.scrollTop=scrollTo;
      }
    },[selDate]);

    return(
      <div>
        <div className="cal-day-header">
          <button className="cal-back-btn" onClick={()=>setView('month')}>‹ 月历</button>
          <div style={{display:'flex',alignItems:'center',gap:4,flex:1,justifyContent:'center'}}>
            <button className="cal-nav-btn" style={{fontSize:18}} onClick={()=>shiftDay(-1)}>‹</button>
            <div className="cal-day-title" style={{minWidth:100,textAlign:'center'}}>{fmtDateShort(selDate)}{selDate===today?' · 今天':''}</div>
            <button className="cal-nav-btn" style={{fontSize:18}} onClick={()=>shiftDay(1)}>›</button>
          </div>
          <button className="cal-add-btn" onClick={()=>setShowAdd(true)}>+ 添加</button>
        </div>

        {/* All-day events */}
        {alldayEvts.length>0&&(
          <div className="allday-strip">
            {alldayEvts.map(e=>(
              <div key={e.id} className="allday-chip" style={{background:getEvtColor(e.colorKey)}}
                onClick={()=>{if(!e.isTask){ const raw=events[e.id]; if(raw) setEditingEvent(raw); }}}>
                {e.title}
              </div>
            ))}
          </div>
        )}

        {/* Timeline */}
        <div className="timeline-scroll" ref={scrollRef} style={{height:'calc(100vh - 240px)',overflowY:'auto'}}>
          <div className="timeline-inner" style={{height:`${24*HOUR_H}px`}}>
            {Array.from({length:24}).map((_,h)=>(
              <div key={h} className="hour-row" style={{height:`${HOUR_H}px`,top:`${h*HOUR_H}px`,position:'absolute',width:'100%',left:0}}>
                <span className="hour-label">{fmtHour(h)}</span>
                <div style={{position:'absolute',left:50,right:0,top:0,height:'1px',background:'var(--hour-line)'}}/>
              </div>
            ))}
            {evtBlocks.map(e=>(
              <div key={e.id} className="evt-block"
                style={{top:e.top,height:e.height,background:getEvtColor(e.colorKey),left:54,right:6}}
                onClick={()=>{if(!e.isTask){ const raw=events[e.id]; if(raw) setEditingEvent(raw); }}}>
                <div className="evt-title">{e.isTask?{gold:'🥇',silver:'🥈',bronze:'🥉'}[e.tier]:''} {e.title}</div>
                {e.height>36&&<div className="evt-time">{String(e.startH).padStart(2,'0')}:{String(e.startM).padStart(2,'0')} – {String(e.endH).padStart(2,'0')}:{String(e.endM).padStart(2,'0')}</div>}
              </div>
            ))}
            {timelineEvts.length===0&&(
              <div className="day-empty" style={{position:'absolute',top:'30%',left:0,right:0}}>
                <div className="day-empty-icon">📭</div>
                <div style={{fontSize:13,color:'var(--text-secondary)'}}>今天还没有任何记录<br/>点击右上角"+ 添加"可添加事件</div>
              </div>
            )}
          </div>
        </div>
      </div>
    );
  };

  return(
    <div className="cal-wrap">
      {view==='month'?<MonthView/>:<DayView/>}
      {showAdd&&<AddEventModal initialDate={selDate} onSave={onAddEvent} onDelete={onDeleteEvent} onClose={()=>setShowAdd(false)}/>}
      {editingEvent&&<AddEventModal event={editingEvent} onSave={onAddEvent} onDelete={onDeleteEvent} onClose={()=>setEditingEvent(null)}/>}
    </div>
  );
}

// ── ROOT APP ─────────────────────────────────────────
function App(){
  const [first,    setFirst]    = useLS(SK.FIRST, null);
  const [plans,    setPlans]    = useLS(SK.PLANS, {});
  const [theme,    setTheme]    = useLS(SK.THEME, 'white');
  const [events,   setEvents]   = useLS(SK.EVENTS, {});
  const [soundEnabled, setSoundEnabled] = useLS(SK.SOUND, true);
  const [hapticEnabled, setHapticEnabled] = useLS(SK.HAPTIC, true);
  const [welcomed,   setWelcomed]   = useLS(SK.WELCOMED, false);
  const [planStyle,  setPlanStyle]  = useLS(SK.PLAN_STYLE, 'morning');
  const [planHour,   setPlanHour]   = useLS(SK.PLAN_HOUR, 21);
  const [habits,     setHabits]     = useLS(SK.HABITS, []);
  // activeDate tracks the last day the user officially set up a plan.
  // When activeDate !== today, the planning modal shows — NO data is ever deleted.
  const [activeDate, setActiveDate] = useLS(SK.ACTIVE_DATE, null);
  const [view,         setView]         = useState('dash');
  const [showTheme,    setShowTheme]    = useState(false);
  const [showHabits,   setShowHabits]   = useState(false);
  const [showWrapUp,   setShowWrapUp]   = useState(false);
  const [forcePlanDate, setForcePlanDate] = useState(null);
  // Compute today fresh every render — never stale, immune to state init bugs
  const today = todayStr();
  // Force re-render every 30s and on visibilitychange so midnight is caught immediately
  const [, _tick] = useState(0);
  useEffect(()=>{
    const bump=()=>_tick(n=>n+1);
    const iv=setInterval(bump,30000);
    const onVis=()=>{ if(!document.hidden) bump(); };
    document.addEventListener('visibilitychange',onVis);
    return ()=>{ clearInterval(iv); document.removeEventListener('visibilitychange',onVis); };
  },[]);
  // Auto day-reset: set a precise timeout to fire exactly at midnight
  // When it fires, the re-render recalculates today → plan becomes null → DailyPlanModal shows
  useEffect(()=>{
    const now=new Date();
    const nextMidnight=new Date(now.getFullYear(),now.getMonth(),now.getDate()+1);
    const msUntilMidnight=nextMidnight.getTime()-now.getTime();
    const t=setTimeout(()=>_tick(n=>n+1), msUntilMidnight+500);
    return ()=>clearTimeout(t);
  },[today]);

  useEffect(()=>{ if(!first) setFirst(today); },[]);

  // Global click sound + haptic — fires on every non-disabled interactive element
  useEffect(()=>{
    const handler=e=>{
      const btn=e.target.closest('button');
      if(btn&&!btn.disabled){
        playClick();
        haptic([15]);
        return;
      }
      // Non-button interactive elements
      if(e.target.closest('.task-card:not(.locked),.cal-day-cell,.theme-opt,.cal-month-header')){
        playClick();
        haptic([15]);
      }
    };
    document.addEventListener('click',handler,true);
    return ()=>document.removeEventListener('click',handler,true);
  },[]);
  useEffect(()=>{
    document.documentElement.setAttribute('data-theme',theme);
    // Keep PWA theme-color in sync with current theme
    const themeColors={white:'#ffffff',cream:'#faf8f3',lavender:'#f3f0fa',green:'#f0f7f0',blue:'#f0f5ff',pink:'#fff0f5',dark:'#090912'};
    const meta=document.getElementById('theme-color-meta');
    if(meta) meta.content=themeColors[theme]||'#ffffff';
  },[theme]);

  // ── 网络状态 + 存储可用性检测 ────────────────────────
  const [isOnline,    setIsOnline]    = useState(typeof navigator!=='undefined'?navigator.onLine:true);
  const [storageOk,   setStorageOk]   = useState(true);
  useEffect(()=>{
    // 检测 localStorage 可用性（无痕模式/禁用时为 false）
    setStorageOk(checkStorageAvailable());
    // 监听网络变化
    const onOnline  = ()=>setIsOnline(true);
    const onOffline = ()=>{ setIsOnline(false); showToast('📡 当前无网络，数据已保存在本地，联网后恢复正常',4000); };
    window.addEventListener('online',  onOnline);
    window.addEventListener('offline', onOffline);
    return ()=>{ window.removeEventListener('online',onOnline); window.removeEventListener('offline',onOffline); };
  },[]);

  const dc    = React.useMemo(()=>{
    const keys=Object.keys(plans).sort();
    return dayCount(keys.length>0 ? keys[0] : (first||today));
  },[plans,first,today]);
  // planDate: which date should the user be planning for, based on their preference
  const planDate    = forcePlanDate || getPlanDate(planStyle, planHour);
  // showingDate: the plan currently shown in dashboard (may be ahead if user pre-planned tomorrow)
  const showingDate = (activeDate && activeDate >= planDate) ? activeDate : planDate;
  // Plan is valid only when user has officially set up a plan for showingDate.
  // Historical plans are NEVER deleted — they stay in `plans` for calendar & review.
  const plan  = (activeDate === showingDate) ? (plans[showingDate] || null) : null;
  const streak= useMemo(()=>calcStreak(plans),[plans]);

  // 顺延：从最近7天里找最新的有未完成任务的计划
  const carryoverTasks=useMemo(()=>{
    for(let i=1;i<=7;i++){
      const d=new Date(); d.setDate(d.getDate()-i);
      const k=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
      const p=plans[k]; if(!p) continue;
      const unfinished=planTasks(p).filter(t=>t.status!=='completed');
      if(unfinished.length>0) return unfinished;
    }
    return [];
  },[plans,today]);
  const savePlan=p=>{ setPlans(prev=>({...prev,[planDate]:p})); setActiveDate(planDate); };
  const updateTask=t=>setPlans(prev=>{
    const p={...prev[showingDate]};
    if(t.tier==='gold') p.goldTask=t;
    else if(t.tier==='silver') p.silverTasks=p.silverTasks.map(x=>x.id===t.id?t:x);
    else p.bronzeTasks=p.bronzeTasks.map(x=>x.id===t.id?t:x);
    return {...prev,[showingDate]:p};
  });
  const addEvent=e=>setEvents(prev=>({...prev,[e.id]:e}));
  const delEvent=id=>setEvents(prev=>{ const n={...prev}; delete n[id]; return n; });
  const addTask=t=>setPlans(prev=>{
    const p={...(prev[showingDate]||{})};
    if(t.tier==='gold') p.goldTask=t;
    else if(t.tier==='silver') p.silverTasks=[...(p.silverTasks||[]),t];
    else p.bronzeTasks=[...(p.bronzeTasks||[]),t];
    return {...prev,[showingDate]:p};
  });
  const deleteTask=t=>setPlans(prev=>{
    const p={...(prev[showingDate]||{})};
    if(t.tier==='gold') p.goldTask=null;
    else if(t.tier==='silver') p.silverTasks=(p.silverTasks||[]).filter(x=>x.id!==t.id);
    else p.bronzeTasks=(p.bronzeTasks||[]).filter(x=>x.id!==t.id);
    return {...prev,[showingDate]:p};
  });
  // 升/降级：从原层移除，加入新层，状态重置为 idle
  const changeTierTask=(task,newTier)=>setPlans(prev=>{
    const p={...prev[showingDate]};
    const upgraded={...task,tier:newTier,status:'idle',completedAt:null,actualMinutes:null,remainingSeconds:null,checkInCount:0};
    if(task.tier==='gold') p.goldTask=null;
    else if(task.tier==='silver') p.silverTasks=(p.silverTasks||[]).filter(x=>x.id!==task.id);
    else p.bronzeTasks=(p.bronzeTasks||[]).filter(x=>x.id!==task.id);
    if(newTier==='gold') p.goldTask=upgraded;
    else if(newTier==='silver') p.silverTasks=[...(p.silverTasks||[]),upgraded];
    else p.bronzeTasks=[...(p.bronzeTasks||[]),upgraded];
    return {...prev,[showingDate]:p};
  });

  return(
    <div id="app-root">
      {/* 无痕模式 / 存储不可用提示 */}
      {!storageOk&&<div className="status-banner banner-incognito">⚠️ 无痕模式或存储被禁用，关闭页面后数据将丢失，建议切换为普通模式使用</div>}
      {/* 离线提示 */}
      {!isOnline&&<div className="status-banner banner-offline">📡 当前无网络，数据已保存在本地，联网后即可正常访问</div>}
      <div className="app-header">
        <div className="header-left">
          <div className="app-header-meta">
            <span className="header-date">{fmtDate(today)}</span>
            <span className="header-day">第 {dc} 天</span>
            {streak>0&&<span className="streak-chip">🔥 {streak}天连击</span>}
          </div>
        </div>
        {plan&&<button className="wrapup-btn" onClick={()=>setShowWrapUp(true)} title="今日收工">
          <svg viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9z"/></svg>
        </button>}
        <button className="habit-btn" onClick={()=>setShowHabits(true)} title="习惯管理">
          <svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
        </button>
        <button className="settings-btn" onClick={()=>setShowTheme(true)} title="选择主题">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg>
        </button>
      </div>

      {view==='dash'     &&plan &&<Dashboard plan={plan} onUpdate={updateTask} onAddTask={addTask} onDeleteTask={deleteTask} onChangeTier={changeTierTask}/>}
      {view==='cal'            &&<CalendarView plans={plans} events={events} onAddEvent={addEvent} onDeleteEvent={delEvent}/>}
      {view==='review'         &&<DataReview plans={plans}/>}
      {view==='settings'       &&<SettingsPanel soundEnabled={soundEnabled} onSoundChange={setSoundEnabled} hapticEnabled={hapticEnabled} onHapticChange={setHapticEnabled} planStyle={planStyle} onPlanStyleChange={setPlanStyle} planHour={planHour} onPlanHourChange={setPlanHour}/>}
      {!welcomed&&<WelcomeModal onStart={(style,hour)=>{setPlanStyle(style);setPlanHour(hour);setWelcomed(true);}}/>}
      {welcomed&&!plan&&<DailyPlanModal onDone={savePlan} dayN={dc} today={planDate} habits={habits} carryoverTasks={carryoverTasks} events={events}/>}
      {showTheme&&<ThemePanel current={theme} onChange={setTheme} onClose={()=>setShowTheme(false)}/>}
      {showHabits&&<HabitsManager habits={habits} onSave={setHabits} onClose={()=>setShowHabits(false)} plan={plan} onAddToday={addTask}/>}
      {showWrapUp&&plan&&<WrapUpModal plan={plan} plans={plans} streak={streak} onClose={()=>setShowWrapUp(false)} onPlanTomorrow={()=>{setForcePlanDate(tomorrowStr());setShowWrapUp(false);}}/>}

      <div className="bottom-nav">
        <button className={`nav-btn${view==='dash'?' active':''}`} onClick={()=>setView('dash')}>
          <span className="nav-icon-wrap">
            <svg className="nav-svg" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h4"/></svg>
          </span>今日任务
        </button>
        <button className={`nav-btn${view==='cal'?' active':''}`} onClick={()=>setView('cal')}>
          <span className="nav-icon-wrap">
            <svg className="nav-svg" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
          </span>日历
        </button>
        <button className={`nav-btn${view==='review'?' active':''}`} onClick={()=>setView('review')}>
          <span className="nav-icon-wrap">
            <svg className="nav-svg" viewBox="0 0 24 24"><path d="M3 20h18"/><rect x="5" y="13" width="3" height="7" rx="0.5"/><rect x="10.5" y="8" width="3" height="12" rx="0.5"/><rect x="16" y="4" width="3" height="16" rx="0.5"/></svg>
          </span>数据复盘
        </button>
        <button className={`nav-btn${view==='settings'?' active':''}`} onClick={()=>setView('settings')}>
          <span className="nav-icon-wrap">
            <svg className="nav-svg" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          </span>设置
        </button>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>

<script>
// 注册 Service Worker（支持离线使用和"添加到主屏幕"）
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js')
      .catch(err => console.log('SW registration failed:', err));
  });
}
</script>
</body>
</html>
