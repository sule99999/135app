    {title:'冥想呼吸',minutes:5},{title:'瑜伽伸展',minutes:20},{title:'居家健身',minutes:30},
    {title:'护眼远眺',minutes:5},{title:'户外散步',minutes:15},
  ]},
  {cat:'🏠 生活资产',items:[
    {title:'极简整理',minutes:10},{title:'每日饮水',minutes:0,isCheckIn:true,checkInTarget:8},
    {title:'记账总结',minutes:5},{title:'烹饪备餐',minutes:30},
  ]},
  {cat:'💬 情绪社交',items:[
    {title:'感恩日记',minutes:5},{title:'家人通话',minutes:15},{title:'发呆放空',minutes:10},
  ]},
  {cat:'⚡ 快充微习惯',items:[
    {title:'核心卷腹',minutes:5},{title:'单词背诵',minutes:10},{title:'站立办公',minutes:20},
  ]},
];
function HabitsManager({habits,onSave,onClose,onAddToday,plan}){
  const [editing,setEditing]=useState(null);
  const [showRec,setShowRec]=useState(false);
  const [selP,setSelP]=useState(null);
  const [selTier,setSelTier]=useState('bronze');
  const [selMin,setSelMin]=useState(15);
  const [selIsCI,setSelIsCI]=useState(false);
  const [selCiTarget,setSelCiTarget]=useState(1);
  const [justAdded,setJustAdded]=useState([]);
  const tierLabel={gold:'🥇',silver:'🥈',bronze:'🥉'};
  const handleSaveHabit=h=>{
    const exists=habits.find(x=>x.id===h.id);
    const next=exists?habits.map(x=>x.id===h.id?h:x):[...habits,h];
    onSave(next); setEditing(null);
  };
  const handleDelete=id=>{ if(window.confirm('删除这个习惯？'))onSave(habits.filter(h=>h.id!==id)); };
  const handleSelectPreset=item=>{
    if(selP&&selP.title===item.title){setSelP(null);return;}
    setSelP(item); setSelMin(item.minutes||0); setSelTier('bronze');
    setSelIsCI(!!item.isCheckIn); setSelCiTarget(item.checkInTarget||1);
  };
  const handleAddPreset=()=>{
    if(!selP)return;
    const h={id:Date.now()+Math.random(),title:selP.title,tier:selTier,
      estimatedMinutes:selIsCI?0:Number(selMin)||5,isCheckIn:selIsCI,
      checkInTarget:selIsCI?(selCiTarget||1):1,autoAdd:false};
    onSave([...habits,h]);
    setSelP(null);
  };
  // 检查习惯是否已在今日计划中
  const isInToday=h=>{
    if(!plan)return false;
    const all=[plan.goldTask,...(plan.silverTasks||[]),...(plan.bronzeTasks||[])].filter(Boolean);
    return all.some(t=>t.title===h.title)||justAdded.includes(h.id);
  };
  const handleAddToday=h=>{
    if(!onAddToday||isInToday(h))return;
    const task={id:genId(),title:h.title,estimatedMinutes:h.isCheckIn?0:h.estimatedMinutes,
      tier:h.tier,status:'idle',actualMinutes:null,pauseCount:0,
      timerStartedAt:null,completedAt:null,remainingSeconds:null,isCheckIn:!!h.isCheckIn,
      checkInTarget:h.isCheckIn?(h.checkInTarget||1):1,checkInCount:0};
    onAddToday(task);
    setJustAdded(a=>[...a,h.id]);
  };
  if(editing!==null) return <HabitForm habit={editing==='new'?null:editing} onSave={handleSaveHabit} onClose={()=>setEditing(null)}/>;
  return(
    <div className="overlay" onClick={onClose}>
      <div className="modal-box modal-welcome" style={{maxWidth:360,maxHeight:'85vh',display:'flex',flexDirection:'column',overflow:'hidden'}} onClick={e=>e.stopPropagation()}>
        {/* ── 固定顶部标题 ── */}
        <div style={{flexShrink:0}}>
          <div style={{fontSize:16,fontWeight:700,marginBottom:3,color:'var(--text-primary)'}}>🔄 习惯与模板</div>
          <div style={{fontSize:11,color:'var(--text-secondary)',marginBottom:16}}>预设后每天规划时一键加入，无需重复输入</div>
        </div>
        {/* ── 可滚动中间区域 ── */}
        <div style={{flex:1,overflowY:'auto',minHeight:0}}>
          {habits.length===0&&!showRec&&(
            <div style={{textAlign:'center',padding:'20px 0',color:'var(--text-secondary)',fontSize:13}}>
              还没有习惯，点下方添加吧
            </div>
          )}
          {habits.map(h=>{
            const inToday=isInToday(h);
            return(
            <div key={h.id} className="habit-item">
              <div className={`habit-tier-dot ${h.tier}`}/>
              <div className="habit-item-info">
                <div className="habit-item-title">
                  {tierLabel[h.tier]} {h.title}
                  {h.autoAdd&&<span className="habit-auto-tag">每日</span>}
                </div>
                <div className="habit-item-meta">{h.isCheckIn?'打卡任务':`${h.estimatedMinutes} 分钟`}</div>
              </div>
              {plan&&<button
                className="habit-today-btn"
                onClick={()=>handleAddToday(h)}
                disabled={inToday}
                title={inToday?'已加入今日':'加入今日计划'}>
                {inToday?'✓':'＋'}
              </button>}
              <button className="card-edit-btn" onClick={()=>setEditing(h)} title="编辑">✏️</button>
              <button className="card-edit-btn" style={{color:'var(--danger)'}} onClick={()=>handleDelete(h.id)} title="删除">🗑️</button>
            </div>
            );
          })}
          <button className="habit-add-btn" onClick={()=>setEditing('new')}>＋ 添加习惯或模板</button>
          <button className="habit-rec-btn" onClick={()=>{setShowRec(v=>!v);setSelP(null);}}>
            {showRec?'▲ 收起推荐':'✨ 推荐养成好习惯'}
          </button>
          {showRec&&(
            <div className="rec-panel">
              {HABIT_PRESETS.map(cat=>(
                <div key={cat.cat}>
                  <div className="rec-cat-label">{cat.cat}</div>
                  <div className="rec-chips">
                    {cat.items.map(item=>{
                      const isAdded=habits.some(h=>h.title===item.title);
                      const isActive=selP&&selP.title===item.title;
                      return(
                        <button key={item.title}
                          className={`rec-chip${isActive?' active':''}`}
                          onClick={()=>!isAdded&&handleSelectPreset(item)}
                          style={isAdded?{opacity:0.38,cursor:'default'}:{}}>
                          {item.title}{isAdded?' ✓':''}
                        </button>
                      );
                    })}
                  </div>
                </div>
              ))}
            </div>
          )}
        </div>
        {/* ── 固定底部：配置栏 + 完成按钮 ── */}
        <div style={{flexShrink:0}}>
          {selP&&(
            <div className="rec-confirm" style={{marginTop:10,marginBottom:0}}>
              {/* 行1：任务名 + 层级选择 */}
              <div style={{display:'flex',alignItems:'center',gap:7}}>
                <span className="rec-confirm-title">「{selP.title}」</span>
                <div className="rec-tier-btns">
                  {['gold','silver','bronze'].map(t=>(
                    <button key={t} className={`rec-tier-btn${selTier===t?' sel-'+t:''}`}
                      onClick={()=>setSelTier(t)}>{tierLabel[t]}</button>
                  ))}
                </div>
              </div>
              {/* 行2：打卡切换 + 时间/次数 */}
              <div style={{display:'flex',alignItems:'center',gap:7,flexWrap:'wrap'}}>
                <button className={`time-chip${selIsCI?` chip-${selTier}`:''}`}
                  onClick={()=>{const v=!selIsCI;setSelIsCI(v);if(!v)setSelCiTarget(1);}}>
                  ✓ 打卡
                </button>
                {selIsCI?(
                  <>
                    <input type="number" className="rec-min-input" value={selCiTarget} min={1} max={99}
                      onChange={e=>setSelCiTarget(Math.max(1,Math.min(99,+e.target.value||1)))}
                      style={{width:44}}/>
                    <span style={{fontSize:11,color:'var(--text-secondary)'}}>次</span>
                    {selCiTarget>1&&<span style={{fontSize:11,color:'var(--bronze)'}}>满{selCiTarget}次完成</span>}
                  </>
                ):(
                  <>
                    <input type="number" className="rec-min-input" value={selMin} min={1} max={180}
                      onChange={e=>setSelMin(e.target.value)}/>
                    <span style={{fontSize:11,color:'var(--text-secondary)'}}>min</span>
                  </>
                )}
              </div>
              {/* 行3：醒目加入按钮 */}
              <button className="rec-add-btn-full" onClick={handleAddPreset}>＋ 加入习惯模板</button>
            </div>
          )}
          <button className="btn btn-ghost" style={{width:'100%',marginTop:10}} onClick={onClose}>完成</button>
        </div>
      </div>
    </div>
  );
}

            <div style={{fontSize:11,color:'var(--text-secondary)',paddingLeft:12,lineHeight:2}}>
              · 无痕 / 隐身模式下使用，关闭窗口即丢失<br/>

            </div>

          <button className="btn btn-ghost" style={{width:'100%',fontSize:12,padding:'10px 0',marginBottom:8}}
            onClick={()=>{
              const data={version:2,exportedAt:new Date().toISOString(),
                first:localStorage.getItem('135app_first'),
                plans:JSON.parse(localStorage.getItem('135app_plans')||'{}'),
                events:JSON.parse(localStorage.getItem('135app_events')||'{}')};
              const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
              const url=URL.createObjectURL(blob);
              const a=document.createElement('a');
              a.href=url;a.download=`135app-backup-${new Date().toISOString().slice(0,10)}.json`;
              a.click();URL.revokeObjectURL(url);
            }}>💾 保存数据备份</button>
          <label className="btn btn-ghost" style={{width:'100%',fontSize:12,padding:'10px 0',textAlign:'center',cursor:'pointer',display:'block',boxSizing:'border-box'}}>
            📥 恢复备份（从文件导入）
            <input type="file" accept=".json" style={{display:'none'}} onChange={e=>{
              const file=e.target.files[0]; if(!file)return;
              const reader=new FileReader();
              reader.onload=ev=>{
                try{
                  const d=JSON.parse(ev.target.result);
                  if(!d.plans) throw new Error('invalid');
                  if(!window.confirm('恢复备份将覆盖当前所有数据，确定继续吗？')) return;
                  if(d.first)  localStorage.setItem('135app_first',d.first);
                  if(d.plans)  localStorage.setItem('135app_plans',JSON.stringify(d.plans));
                  if(d.events) localStorage.setItem('135app_events',JSON.stringify(d.events));
                  window.location.reload();
                }catch(err){ alert('文件格式有误，无法恢复'); }
              };
              reader.readAsText(file);
              e.target.value='';
            }}/>
          </label>
          <div style={{fontSize:10,color:'var(--text-secondary)',lineHeight:1.5,marginTop:8}}>
            建议定期保存备份，防止浏览器清理缓存时数据丢失
          </div>
        </div>

        {/* Danger zone */}
        <div style={{padding:'14px',borderRadius:13,background:'rgba(255,82,82,0.06)',border:'1px solid rgba(255,82,82,0.18)'}}>
          <div style={{fontSize:11,fontWeight:600,color:'var(--danger)',marginBottom:10,textTransform:'uppercase',letterSpacing:'.5px'}}>危险区域</div>
          <button
            className="btn"
            style={{width:'100%',background:'rgba(255,82,82,0.12)',color:'var(--danger)',border:'1px solid rgba(255,82,82,0.3)',borderRadius:10,padding:'10px 0',fontWeight:700,fontSize:13,cursor:'pointer'}}
            onClick={()=>{
              if(window.confirm('确定要清除所有数据吗？\n计划、记录、日历事件都会被删除，且无法恢复。')){
                Object.values({FIRST:'135app_first',PLANS:'135app_plans',THEME:'135app_theme',EVENTS:'135app_events'})
                  .forEach(k=>localStorage.removeItem(k));
                window.location.reload();
              }
            }}
          >🗑️ 清除所有数据，重新开始</button>
        </div>
      </div>
    </div>
  );
}

// ── DAILY PLAN MODAL ─────────────────────────────────
function DailyPlanModal({onDone,dayN,today,habits=[],carryoverTasks=[],events={}}){
  const autoHabits=habits.filter(h=>h.autoAdd);
  const libraryHabits=habits.filter(h=>!h.autoAdd);
  const hasAuto=autoHabits.length>0;
  const hasCarry=carryoverTasks.length>0;
  // 今日日历事件（排除全天事件，按开始时间排序）
  const todayEvents=React.useMemo(()=>
    Object.values(events||{})
      .filter(e=>e.date===today)
      .sort((a,b)=>(a.startTime||'').localeCompare(b.startTime||''))
  ,[events,today]);
  const hasTodayEvents=todayEvents.length>0;
  // step: 1=欢迎  2=习惯确认(仅有autoHabits时)  3=金牌  4=银牌  5=铜牌
  const [step,setStep]=useState(1);
  // 日历事件提示
  const [showEventPrompt,setShowEventPrompt]=useState(false);
  const [eventSelections,setEventSelections]=useState(()=>
    todayEvents.map(e=>({id:e.id,accepted:false,tier:'bronze',minutes:calcEventMins(e.startTime,e.endTime)}))
  );
  const applyEvents=()=>{
    eventSelections.forEach((sel,i)=>{
      if(!sel.accepted) return;
      const ev=todayEvents[i];
      const t=newTask(ev.title,sel.minutes,sel.tier,false,1);
      if(sel.tier==='gold'){if(!goldTitle){setGoldTitle(ev.title);setGoldTime(sel.minutes);}}
      else if(sel.tier==='silver'){if(silverRef.current.length<3) silverRef.current=[...silverRef.current,t];}
      else{if(bronzeRef.current.length<5) bronzeRef.current=[...bronzeRef.current,t];}
    });
    setShowEventPrompt(false);
    if(hasCarry){setShowCarry(true);}else{setStep(3);}
  };
  // 顺延
  const [showCarry,setShowCarry]=useState(false);
  const [selectedCarryIds,setSelectedCarryIds]=useState(()=>carryoverTasks.map(t=>t.id));
  const toggleCarry=id=>setSelectedCarryIds(ids=>ids.includes(id)?ids.filter(x=>x!==id):[...ids,id]);
  const goToGold=()=>{ if(hasTodayEvents){setShowEventPrompt(true);}else if(hasCarry){setShowCarry(true);}else{setStep(3);} };
  const applyCarry=()=>{
    const sel=carryoverTasks.filter(t=>selectedCarryIds.includes(t.id));
    const goldC=sel.find(t=>t.tier==='gold');
    const svC=sel.filter(t=>t.tier==='silver');
    const bzC=sel.filter(t=>t.tier==='bronze');
    if(goldC&&!goldTitle){setGoldTitle(goldC.title);setGoldTime(goldC.estimatedMinutes||25);setGoldIsCheckIn(!!goldC.isCheckIn);setGoldCiTarget(goldC.checkInTarget||1);}
    const existSv=silverRef.current;
    const newSv=[...existSv,...svC.filter(c=>!existSv.find(e=>e.title===c.title)).map(t=>newTask(t.title,t.estimatedMinutes,'silver',t.isCheckIn,t.checkInTarget||1))].slice(0,3);
    silverRef.current=newSv; habitSvCount.current=newSv.length;
    const existBz=bronzeRef.current;
    const newBz=[...existBz,...bzC.filter(c=>!existBz.find(e=>e.title===c.title)).map(t=>newTask(t.title,t.estimatedMinutes,'bronze',t.isCheckIn,t.checkInTarget||1))].slice(0,5);
    bronzeRef.current=newBz; habitBzCount.current=newBz.length;
    setShowCarry(false); setStep(3);
  };
  // 习惯确认：默认全选
  const [checkedIds,setCheckedIds]=useState(()=>autoHabits.map(h=>h.id));
  const toggleHabit=id=>setCheckedIds(ids=>ids.includes(id)?ids.filter(x=>x!==id):[...ids,id]);
  const [goldTitle,setGoldTitle]=useState('');
  const [goldTime,setGoldTime]=useState(25);
  const [goldIsCheckIn,setGoldIsCheckIn]=useState(false);
  const planInputRef=useRef(null);
  const silverRef=useRef([]);
  const bronzeRef=useRef([]);
  const habitSvCount=useRef(0);
  const habitBzCount=useRef(0);
  const [svStep,setSvStep]=useState(0);
  const [bzStep,setBzStep]=useState(0);
  const [curIn,setCurIn]=useState('');
  const [curT,setCurT]=useState(25);
  const [curIsCheckIn,setCurIsCheckIn]=useState(false);
  const [curCiTarget,setCurCiTarget]=useState(1);
  const [goldCiTarget,setGoldCiTarget]=useState(1);
  const newTask=(title,time,tier,ici,ciTarget=1)=>({id:genId(),title,estimatedMinutes:ici?0:time,tier,status:'idle',actualMinutes:null,pauseCount:0,timerStartedAt:null,completedAt:null,remainingSeconds:null,isCheckIn:!!ici,checkInTarget:ici?(ciTarget||1):1,checkInCount:0});
  const resetCur=()=>{setCurIn('');setCurT(25);setCurIsCheckIn(false);setCurCiTarget(1);};
  const finish=()=>onDone({date:today,goldTask:newTask(goldTitle,goldTime,'gold',goldIsCheckIn,goldCiTarget),silverTasks:silverRef.current,bronzeTasks:bronzeRef.current});
  const StepDots=({cur,total})=>(<div className="step-dots">{Array.from({length:total}).map((_,i)=>(<div key={i} className={`step-dot${i<cur?' done':i===cur?' active':''}`}/>))}</div>);
  // 自动聚焦 + 习惯槽位预填
  useEffect(()=>{
    if(step<3) return;
    if(step===4&&svStep<habitSvCount.current){
      const h=silverRef.current[svStep];
      setCurIn(h.title);setCurT(h.estimatedMinutes);setCurIsCheckIn(!!h.isCheckIn);setCurCiTarget(h.checkInTarget||1);
    } else if(step===5&&bzStep<habitBzCount.current){
      const h=bronzeRef.current[bzStep];
      setCurIn(h.title);setCurT(h.estimatedMinutes);setCurIsCheckIn(!!h.isCheckIn);setCurCiTarget(h.checkInTarget||1);
    }
    const t=setTimeout(()=>planInputRef.current?.focus(),80);
    return ()=>clearTimeout(t);
  },[step,svStep,bzStep]);
  // 确认习惯后，将选中项写入refs，并预填金牌
  const confirmHabits=()=>{
    const confirmed=autoHabits.filter(h=>checkedIds.includes(h.id));
    const goldH=confirmed.find(h=>h.tier==='gold');
    const sv=confirmed.filter(h=>h.tier==='silver');
    const bz=confirmed.filter(h=>h.tier==='bronze');
    silverRef.current=sv.map(h=>newTask(h.title,h.estimatedMinutes,'silver',h.isCheckIn,h.checkInTarget||1));
    bronzeRef.current=bz.map(h=>newTask(h.title,h.estimatedMinutes,'bronze',h.isCheckIn,h.checkInTarget||1));
    habitSvCount.current=sv.length;
    habitBzCount.current=bz.length;
    if(goldH){setGoldTitle(goldH.title);setGoldTime(goldH.estimatedMinutes);setGoldIsCheckIn(!!goldH.isCheckIn);}
    goToGold();
  };
  const [usedChipTitles,setUsedChipTitles]=useState([]);
  // 灵感库：用户库存习惯 + HABIT_PRESETS 补全，去重合并；已点击的从池子里消失
  const chipPool=React.useMemo(()=>{
    const libItems=libraryHabits.map(h=>({title:h.title,estimatedMinutes:h.estimatedMinutes,isCheckIn:!!h.isCheckIn,checkInTarget:h.checkInTarget||1}));
    const libTitles=new Set(libItems.map(c=>c.title));
    const presetItems=HABIT_PRESETS.flatMap(cat=>cat.items)
      .filter(p=>!libTitles.has(p.title))
      .map(p=>({title:p.title,estimatedMinutes:p.minutes||0,isCheckIn:!!p.isCheckIn,checkInTarget:p.checkInTarget||1}));
    return [...libItems,...presetItems];
  },[libraryHabits.length]);
  const LibChips=({onPick})=>{
    const chips=chipPool.filter(c=>!usedChipTitles.includes(c.title));
    if(!chips.length) return null;
    return(
      <div className="chip-wall-wrap">
        <div className="chip-wall-label">💡 灵感库，点击填入</div>
        <div className="chip-wall">
          {chips.slice(0,8).map(c=>(
            <button key={c.title} className="chip-pin" onClick={()=>{
              setUsedChipTitles(u=>[...u,c.title]);
              onPick(c);
            }}>
              {c.title}
              {c.isCheckIn
                ? <span className="chip-pin-ci">🔁</span>
                : (c.estimatedMinutes ? <span className="chip-pin-ci">{c.estimatedMinutes}m</span> : null)}
            </button>
          ))}
        </div>
      </div>
    );
  };
  function goToBronze(){setStep(5);setBzStep(0);/* useEffect 会在 step===5&&bzStep<habitBzCount 时预填 */}
  function doSilver(skip){
    if(skip){goToBronze();return;}
    if(svStep<habitSvCount.current){
      // 确认/编辑习惯槽位：覆盖写回（允许用户修改）
      if(curIn.trim()){const u=[...silverRef.current];u[svStep]=newTask(curIn.trim(),curT,'silver',curIsCheckIn,curCiTarget);silverRef.current=u;}
    } else {
      // 新增槽位
      if(curIn.trim()) silverRef.current=[...silverRef.current,newTask(curIn.trim(),curT,'silver',curIsCheckIn,curCiTarget)];
    }
    const next=svStep+1;
    if(next>=3){goToBronze();}else{setSvStep(next);if(next>=habitSvCount.current)resetCur();}
  }
  function doBronze(skip){
    if(skip){finish();return;}
    if(bzStep<habitBzCount.current){
      // 确认/编辑习惯槽位
      if(curIn.trim()){const u=[...bronzeRef.current];u[bzStep]=newTask(curIn.trim(),curT,'bronze',curIsCheckIn,curCiTarget);bronzeRef.current=u;}
    } else {
      // 新增槽位
      if(curIn.trim()) bronzeRef.current=[...bronzeRef.current,newTask(curIn.trim(),curT,'bronze',curIsCheckIn,curCiTarget)];
    }
    const next=bzStep+1;
    if(next>=5) finish(); else{setBzStep(next);if(next>=habitBzCount.current)resetCur();}
  }
  const tierLabel={gold:'🥇',silver:'🥈',bronze:'🥉'};
  const tierName={gold:'金牌',silver:'银牌',bronze:'铜牌'};
  // ── 日历事件提示屏
  if(showEventPrompt){
    const acceptedCount=eventSelections.filter(s=>s.accepted).length;
    const tierLabel={gold:'🥇',silver:'🥈',bronze:'🥉'};
    return(<div className="overlay"><div className="modal-box modal-welcome">
      <div style={{textAlign:'center',marginBottom:16}}>
        <div style={{fontSize:36,marginBottom:6}}>📅</div>
        <div style={{fontSize:16,fontWeight:800,color:'var(--gold)'}}>今日日历事件</div>
        <div style={{fontSize:12,color:'var(--text-secondary)',marginTop:4}}>
          您预设了 {todayEvents.length} 个今日事件，是否加入今日任务？
        </div>
      </div>
      <div style={{maxHeight:340,overflowY:'auto',marginBottom:12}}>
        {todayEvents.map((ev,i)=>{
          const sel=eventSelections[i];
          const timeStr=ev.allDay?'全天':ev.startTime?(ev.endTime?`${ev.startTime} – ${ev.endTime}`:ev.startTime):'';
          return(
            <div key={ev.id} style={{marginBottom:10,borderRadius:13,
              border:`1.5px solid ${sel.accepted?'rgba(255,215,0,0.45)':'var(--chip-border)'}`,
              background:sel.accepted?'rgba(255,215,0,0.06)':'var(--chip-bg)',
              overflow:'hidden',transition:'all .18s'}}>
              {/* 事件行 */}
              <div style={{display:'flex',alignItems:'center',gap:10,padding:'11px 13px',cursor:'pointer'}}
                onClick={()=>setEventSelections(s=>s.map((x,j)=>j===i?{...x,accepted:!x.accepted}:x))}>
                <div style={{width:20,height:20,borderRadius:6,flexShrink:0,
                  border:`2px solid ${sel.accepted?'var(--gold)':'var(--chip-border)'}`,
                  background:sel.accepted?'var(--gold)':'transparent',
                  display:'flex',alignItems:'center',justifyContent:'center',transition:'all .18s'}}>
                  {sel.accepted&&<span style={{color:'#000',fontSize:12,fontWeight:800,lineHeight:1}}>✓</span>}
                </div>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontSize:13,fontWeight:600,color:'var(--text-primary)',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{ev.title}</div>
                  {timeStr&&<div style={{fontSize:11,color:'var(--text-secondary)',marginTop:2}}>⏰ {timeStr}</div>}
                  {ev.notes&&<div style={{fontSize:11,color:'var(--text-secondary)',marginTop:1,opacity:.8}}>📝 {ev.notes}</div>}
                </div>
              </div>
              {/* 展开的层级 + 时间设置 */}

    {!isBzHabit&&<button className="btn btn-ghost" onClick={()=>doBronze(true)}>跳过，完成铜牌计划 🎯</button>}
  </div></div>);}
  return null;
}

// ── POMODORO TIMER ───────────────────────────────────
function PomodoroTimer({task,onComplete,onPause}){
  const tier=task.tier;
  const [phase,setPhase]=useState('running');
  const [addMin,setAddMin]=useState(15);
  const [pauses,setPauses]=useState(0);
  const ivRef=useRef(null);
  const startWallRef=useRef(task.timerStartedAt||new Date().toISOString());

  // ── Wall-clock epoch ──────────────────────────────
  // Instead of counting ticks, we record a reference point and compute
  // elapsed time from Date.now(). This survives mobile background throttling.
  const initialTotal = task.estimatedMinutes * 60;
  const priorSecs = task.remainingSeconds != null
    ? Math.max(0, initialTotal - task.remainingSeconds) : 0;
  const epochRef = useRef({ startMs: Date.now(), priorSecs, totalSecs: initialTotal });

  const computeDisplay = useCallback(() => {
    const e = epochRef.current;
    const elapsed = e.priorSecs + Math.floor((Date.now() - e.startMs) / 1000);
    const tLeft   = Math.max(0, e.totalSecs - elapsed);
    const isOv    = elapsed >= e.totalSecs;
    const ovTime  = isOv ? elapsed - e.totalSecs : 0;
    return { tLeft, isOv, ovTime, elapsed };
  }, []);

  const [disp, setDisp] = useState(computeDisplay);
  const beepedRef = useRef(false); // beep fires once when overtime begins

  const startTicking = useCallback(() => {
    clearInterval(ivRef.current);
    ivRef.current = setInterval(() => {
      const d = computeDisplay();
      setDisp(d);
      if(d.isOv && !beepedRef.current){ beepedRef.current=true; playBeep(); haptic([80]); }
    }, 500);
  }, [computeDisplay]);

  // Sound & haptic driven purely by phase transitions — single source of truth
  useEffect(() => {
    if(phase === 'evaluate') { playChime(); haptic([150,80,150]); }
    if(phase === 'success')  { playSuccess(); haptic([80,50,80,50,200]); }
  }, [phase]);

  // Start ticking on mount
  useEffect(() => { startTicking(); return () => clearInterval(ivRef.current); }, []);

  // Page Visibility API: refresh immediately when user returns to foreground
  useEffect(() => {
    const onVisible = () => {
      if(document.hidden) return;
      const d = computeDisplay();
      setDisp(d);
      if(d.isOv && !beepedRef.current){ beepedRef.current=true; playBeep(); haptic([80]); }
    };
    document.addEventListener('visibilitychange', onVisible);
    return () => document.removeEventListener('visibilitychange', onVisible);
  }, [computeDisplay]);

  const earlyDone = () => { clearInterval(ivRef.current); setPhase('confirmEarly'); };

  const confirmDone = () => {
    clearInterval(ivRef.current);
    const d = computeDisplay();
    const actual = d.isOv
      ? Math.ceil(epochRef.current.totalSecs / 60) + Math.ceil(d.ovTime / 60)
      : Math.max(1, Math.ceil(d.elapsed / 60));
    setPhase('success');
    setTimeout(() => onComplete({
      ...task, actualMinutes: actual, pauseCount: pauses,
      status: 'completed',
      timerStartedAt: startWallRef.current,
      completedAt: new Date().toISOString(),
    }), 1800);
  };

  const handleAddTime = () => {
    const d = computeDisplay();
    // Extend: anchor a new epoch so elapsed resets relative to now,
    // but with enough totalSecs to add the chosen minutes on top of elapsed
    epochRef.current = {
      startMs:   Date.now(),
      priorSecs: d.elapsed,
      totalSecs: d.elapsed + addMin * 60,
    };
    setDisp(computeDisplay());
    setPhase('running');
    setPauses(p => p + 1);
    startTicking();
  };

  const handlePause = () => {
    clearInterval(ivRef.current);
    const d = computeDisplay();
    onPause(task, d.isOv ? 0 : d.tLeft);
  };

  const { tLeft, isOv, ovTime } = disp;
  const progress = isOv ? 0 : (tLeft / epochRef.current.totalSecs) * 100;

  if(phase==='success') return(<div className="timer-overlay"><div className="success-splash">
    <span className="success-emoji">🎉</span>
    <div className="success-title">任务完成！</div>
    <div className="success-sub">{tier==='gold'?'🥇 金牌任务拿下！太棒了！':tier==='silver'?'🥈 银牌任务完成！':'🥉 铜牌任务完成！'}</div>
  </div></div>);

  if(phase==='confirmEarly') return(<div className="timer-overlay"><div className="dialog-box">
    <div className="dialog-emoji">⚡</div>
    <div className="dialog-title">确认完成任务？</div>
    <div className="dialog-sub">{isOv?`已超时 ${Math.floor(ovTime/60)}分${ovTime%60}秒，确认标记为完成？`:`距计划还剩 ${fmt(tLeft)}，确认提前完成？`}</div>
    <div className="dialog-row">
      <button className="dialog-btn dialog-yes" onClick={confirmDone}>✅ 确认完成</button>
      <button className="dialog-btn dialog-no"  onClick={()=>{startTicking();setPhase('running');}}>继续计时</button>
    </div>
    {!isOv&&<button className="dialog-cancel" onClick={()=>setPhase('addTime')}>➕ 加时后继续</button>}
  </div></div>);

  if(phase==='evaluate') return(<div className="timer-overlay"><div className="dialog-box">
    <div className="dialog-emoji">🤔</div>
    <div className="dialog-title">任务完成了吗？</div>
    <div className="dialog-sub">{isOv?`已超时 ${Math.floor(ovTime/60)}分${ovTime%60}秒`:`提前完成，剩余 ${fmt(tLeft)}`}</div>
    <div className="dialog-row">
      <button className="dialog-btn dialog-yes" onClick={confirmDone}>✅ 完成了</button>
      <button className="dialog-btn dialog-no"  onClick={()=>setPhase('addTime')}>➕ 加时</button>
    </div>
    <button className="dialog-cancel" onClick={()=>onPause(task,0)}>取消，回到主界面</button>
  </div></div>);

  if(phase==='addTime') return(<div className="timer-overlay"><div className="dialog-box">
    <div className="dialog-emoji">⏰</div>
    <div className="dialog-title">增加时间</div>
    <div className="dialog-sub">继续为该任务追加计时</div>
    <div className="time-chips" style={{justifyContent:'center',marginBottom:16}}>
      {[10,15,20,25,30,45].map(t=>(<button key={t} className={`time-chip${addMin===t?' chip-gold':''}`} onClick={()=>setAddMin(t)}>+{t}分钟</button>))}
    </div>
    <button className="dialog-btn dialog-yes" style={{width:'100%',padding:12,marginBottom:9}} onClick={handleAddTime}>继续计时</button>
    <button className="dialog-cancel" onClick={()=>onPause(task,0)}>放弃，回到主界面</button>
  </div></div>);

  return(<div className={`timer-overlay timer-overlay-${tier}`}><div className={`timer-card timer-${tier}`}>
    <div className="timer-tier-label">{tier==='gold'?'🥇 金牌任务':tier==='silver'?'🥈 银牌任务':'🥉 铜牌任务'}</div>
    <div className="timer-task-name">{task.title}</div>
    <div className={`timer-digits ${isOv?'digits-overtime':'digits-normal'}`}>{isOv?`+${fmt(ovTime)}`:fmt(tLeft)}</div>
    {!isOv&&<div className="timer-prog-wrap"><div className="timer-prog-bar" style={{width:`${progress}%`}}/></div>}
    <div className={`timer-status${isOv?' overtime':''}`}>{isOv?'⚠️ 超时记录中 — 点击标记完成即可结束':`预计 ${task.estimatedMinutes} 分钟 · 专注进行中…`}</div>
    {pauses>0&&<div style={{fontSize:11,color:'var(--text-secondary)',marginBottom:8}}>已加时 {pauses} 次</div>}
    <div style={{display:'flex',flexDirection:'column',gap:8}}>
      <button className="btn btn-green" onClick={earlyDone}>✅ {isOv?'标记完成':'提前完成'}</button>
      <button className="btn btn-ghost" onClick={handlePause}>← 暂停，回到主界面</button>
    </div>
  </div></div>);
}

// ── ADD TASK MODAL ───────────────────────────────────
function AddTaskModal({onSave,onClose,plan}){
  const addInputRef=useRef(null);
  useEffect(()=>{ const t=setTimeout(()=>addInputRef.current?.focus(),80); return ()=>clearTimeout(t); },[]);
  const goldFull  = plan && !!plan.goldTask;
  const silverFull= plan && (plan.silverTasks||[]).length >= 3;
  const bronzeFull = plan && (plan.bronzeTasks||[]).length >= 5;
  const isFull = t=>(t==='gold'&&goldFull)||(t==='silver'&&silverFull)||(t==='bronze'&&bronzeFull);
  const TIER_LABEL={gold:'金牌',silver:'银牌',bronze:'铜牌'};
  const TIER_LIMIT={gold:1,silver:3,bronze:5};
  const defaultTier= goldFull ? (silverFull ? (bronzeFull?'gold':'bronze') : 'silver') : 'gold';
  const [tier,setTier]=useState(defaultTier);
  const [title,setTitle]=useState('');
  const [time,setTime]=useState(25);
  const [isCI,setIsCI]=useState(false);

        {isCI&&<div style={{display:'flex',alignItems:'center',gap:8,marginTop:10}}>

// ── TASK CARD ────────────────────────────────────────
function TaskCard({task,locked,onStart,onEdit,onDelete,onUndoComplete,onQuickSave}){
  const done=task.status==='completed';
  const tier=task.tier;
  const tierEmoji = tier==='gold'?'🥇':tier==='silver'?'🥈':'🥉';

  if(done){
    const stampClass=`done-stamp done-stamp-${tier}`;
    return(
      <div className={`task-card task-card-${tier} done-card`}>
        <div className="card-inner">
          <div className="card-top">
            <div className="card-title" style={{textDecoration:'line-through',opacity:.65}}>
              <span style={{marginRight:5}}>{tierEmoji}</span>{task.title}
            </div>
            <span className={`card-badge badge-${tier}`}>✅</span>
          </div>
          <div className="card-meta">
            {task.actualMinutes>0&&<span>用时 {task.actualMinutes}min</span>}
            <span className="card-btn-group">
              {onUndoComplete&&<button className="card-edit-btn"
                onClick={e=>{e.stopPropagation();onUndoComplete(task);}}
                onTouchStart={e=>e.stopPropagation()}
                onTouchEnd={e=>{e.stopPropagation();onUndoComplete(task);}}
                title="撤销完成">↩️</button>}
              {onDelete&&<button className="card-edit-btn"
                onClick={e=>{e.stopPropagation();onDelete(task);}}
                onTouchStart={e=>e.stopPropagation()}
                onTouchEnd={e=>{e.stopPropagation();onDelete(task);}}
                title="删除任务" style={{color:'var(--danger)'}}>🗑️</button>}
            </span>
          </div>
          <div className={stampClass}>DONE</div>
        </div>
      </div>
    );
  }

  const isPaused = task.status==='paused';
  const isCI = !!task.isCheckIn;
  const ciTarget = task.checkInTarget||1;
  const ciCount  = task.checkInCount||0;
  const isMultiCI = isCI && ciTarget>1;
  const remainMins = isPaused && task.remainingSeconds!=null ? Math.ceil(task.remainingSeconds/60) : null;
  // ── 内联编辑状态 ──
  const [isInlineEdit,setIsInlineEdit]=useState(false);
  const [editVal,setEditVal]=useState('');
  const inlineRef=useRef(null);
  const longPressTimer=useRef(null);
  // 防止 touchend 之后的合成 click 双重触发
  const touchHandled=useRef(false);

  useEffect(()=>{ if(isInlineEdit&&inlineRef.current) inlineRef.current.focus(); },[isInlineEdit]);

  const startInlineEdit=e=>{
    if(locked||!onQuickSave||task.status==='completed') return;
    e.stopPropagation();
    setEditVal(task.title);
    setIsInlineEdit(true);
  };
  const saveInlineEdit=()=>{
    const v=editVal.trim();
    if(v&&v!==task.title&&onQuickSave) onQuickSave({...task,title:v});
    setIsInlineEdit(false);
  };
  const cancelInlineEdit=()=>setIsInlineEdit(false);
  // 长按 (移动端)
  const touchStartPos=useRef({x:0,y:0});
  const touchMoved=useRef(false);
  const handleTouchStart=e=>{
    touchMoved.current=false;
    touchHandled.current=false;
    touchStartPos.current={x:e.touches[0].clientX,y:e.touches[0].clientY};
    if(locked||!onQuickSave||task.status==='completed') return;
    longPressTimer.current=setTimeout(()=>{
      touchMoved.current=true;
      setEditVal(task.title); setIsInlineEdit(true);
    },600);
  };
  const handleTouchMove=e=>{
    clearTimeout(longPressTimer.current);
    const dx=e.touches[0].clientX-touchStartPos.current.x;
    const dy=e.touches[0].clientY-touchStartPos.current.y;
    if(Math.abs(dx)>8||Math.abs(dy)>8) touchMoved.current=true;
  };
  const triggerStart=()=>{
    if(locked||isInlineEdit) return;
    onStart(task);
  };
  const handleTouchEnd=e=>{
    clearTimeout(longPressTimer.current);
    // 不调用 e.preventDefault()，避免阻断浏览器滚动惯性造成页面跳动
    if(!touchMoved.current&&!locked&&!isInlineEdit){
      touchHandled.current=true;
      // 300ms 后重置，保证后续 click 正常
      setTimeout(()=>{ touchHandled.current=false; },300);
      triggerStart();
    }
  };
  // 桌面端 click；移动端 touch 已处理过则跳过，避免双重触发
  const handleClick=()=>{ if(touchHandled.current) return; triggerStart(); };
  // 多次打卡的卡片进度条宽度
  const ciPct = isMultiCI ? Math.min(100, ciCount/ciTarget*100) : 0;
  return(
    <div className={`task-card task-card-${tier}${locked?' locked':''}`} onClick={handleClick}
         onTouchStart={handleTouchStart} onTouchEnd={handleTouchEnd} onTouchMove={handleTouchMove}>
      <div className="card-inner">
        <div className="card-top">
          {isInlineEdit?(
            <div className="inline-edit-wrap">
              <input ref={inlineRef} className="inline-edit-input" value={editVal} maxLength={100}
                onChange={e=>setEditVal(e.target.value)}
                onBlur={saveInlineEdit}
                onClick={e=>e.stopPropagation()}
                onKeyDown={e=>{ e.stopPropagation(); if(e.key==='Enter') saveInlineEdit(); if(e.key==='Escape') cancelInlineEdit(); }}/>
            </div>
          ):(
            <div className={`card-title title-expanded`}
                 onDoubleClick={startInlineEdit}
                 title={'双击编辑标题·长按编辑'}>
              <span style={{marginRight:5}}>{tierEmoji}</span>{task.title}
            </div>
          )}
          <span className={`card-badge badge-${tier}`}>{locked?'🔒':isMultiCI?`${ciCount}/${ciTarget}`:isCI?'✓ 打卡':isPaused?'⏸ 继续':'▶ 开始'}</span>
        </div>
        {task.notes&&<div style={{fontSize:11,color:'var(--text-secondary)',padding:'2px 0 4px',lineHeight:1.5,wordBreak:'break-word',opacity:.85}}>📝 {task.notes}</div>}
        <div className="card-meta">
          {isMultiCI
            ? <span>每点一次 +1，目标 {ciTarget} 次</span>
            : isCI
            ? <span>点击即完成，无需计时</span>
            : isPaused && remainMins!=null
              ? <span>⏸ 剩余约 {remainMins} 分钟</span>
              : <span>⏱ {task.estimatedMinutes}分钟</span>
          }
          {!locked&&(onEdit||onDelete)&&(
            <span className="card-btn-group">
              {onEdit&&task.status!=='completed'&&<button className="card-edit-btn"
                onClick={e=>{e.stopPropagation();onEdit(task);}}
                onTouchStart={e=>e.stopPropagation()}
                onTouchEnd={e=>{e.stopPropagation();onEdit(task);}}
                title="编辑任务">✏️</button>}
              {onDelete&&<button className="card-edit-btn"
                onClick={e=>{e.stopPropagation();onDelete(task);}}
                onTouchStart={e=>e.stopPropagation()}
                onTouchEnd={e=>{e.stopPropagation();onDelete(task);}}
                title="删除任务" style={{color:'var(--danger)'}}>🗑️</button>}
            </span>
          )}
        </div>
      </div>
    </div>
  );
}

// ── DASHBOARD ────────────────────────────────────────
function Dashboard({plan,onUpdate,onAddTask,onDeleteTask,onChangeTier}){
  const [activeId,setActiveId]=useState(null);
  const [editTask,setEditTask]=useState(null);
  const [showAddTask,setShowAddTask]=useState(false);
  const [deleteConfirm,setDeleteConfirm]=useState(null);
  const [showGoldComplete,setShowGoldComplete]=useState(false);
  const all=planTasks(plan);
  const activeTask=activeId?all.find(t=>t.id===activeId):null;
  const done=all.filter(t=>t.status==='completed').length;

  // 后台恢复：页面重载时找回正在计时的任务
  useEffect(()=>{
    if(!plan) return;
    const running=planTasks(plan).find(t=>
      t.timerStartedAt && t.status!=='completed' && t.status!=='paused' && !t.isCheckIn
    );
    if(running) setActiveId(running.id);
  // eslint-disable-next-line react-hooks/exhaustive-deps
  },[]);

  const start=t=>{
    if(t.status==='completed') return;
    // Check-in task: complete immediately (or increment count for multi-check-in)
    if(t.isCheckIn){
      const target=t.checkInTarget||1;
      if(target>1){
        const newCount=(t.checkInCount||0)+1;
        const done=newCount>=target;
        onUpdate({...t,checkInCount:newCount,
          status:done?'completed':t.status,
          actualMinutes:done?0:t.actualMinutes,
          completedAt:done?new Date().toISOString():t.completedAt});
        playDoorbell();
        if(done&&t.tier==='gold') setShowGoldComplete(true);
      } else {
        onUpdate({...t,status:'completed',actualMinutes:0,completedAt:new Date().toISOString()});
        if(t.tier==='gold') setShowGoldComplete(true);
      }
      return;
    }
    if(t.status==='idle'){
      if(!t.timerStartedAt){
        // 真正的第一次启动：记录起始时间
        const updated={...t, timerStartedAt:new Date().toISOString()};
        onUpdate(updated);
      }
      // 若 timerStartedAt 已存在（后台重载恢复），保留原始时间，不重置
    }
    // If paused: just reopen timer — keep original timerStartedAt
    setActiveId(t.id);
  };
  const complete=t=>{ onUpdate(t); setActiveId(null); if(t.tier==='gold') setShowGoldComplete(true); };
  const pause=(t, remaining)=>{
    // Save remaining seconds so the timer can resume from where it left off
    onUpdate({...t, status:'paused', remainingSeconds: remaining});
    setActiveId(null);
  };
  const handleSaveEdit=t=>{ onUpdate(t); setEditTask(null); };
  const handleAddTask=t=>{ onAddTask(t); setShowAddTask(false); };
  const handleDeleteReq=t=>setDeleteConfirm(t);
  const confirmDelete=()=>{ if(deleteConfirm){ onDeleteTask(deleteConfirm); setDeleteConfirm(null); } };
  // 撤销完成：恢复为 idle，清除完成数据
  const undoComplete=t=>onUpdate({...t,status:'idle',completedAt:null,actualMinutes:null,remainingSeconds:null});

  const Sec=({tier,items})=>{
    const dc=items.filter(t=>t.status==='completed').length;
    const label=tier==='gold'?'今日必做':tier==='silver'?'重要任务':'待办事项';
    const icon=tier==='gold'?'🥇':tier==='silver'?'🥈':'🥉';
    // 未完成任务在前，已完成任务沉底
    const sorted=[...items].sort((a,b)=>(a.status==='completed'?1:0)-(b.status==='completed'?1:0));
    return(
      <div className={`dash-section section-${tier}`}>
        <div className="section-header">
          <span style={{fontSize:18}}>{icon}</span>
          <span className="section-label">{label}</span>
          <span className="section-count">{dc}/{items.length}</span>
        </div>
        {sorted.map(t=>(<TaskCard key={t.id} task={t} locked={!!activeId&&activeId!==t.id} onStart={start} onEdit={setEditTask} onDelete={handleDeleteReq} onUndoComplete={undoComplete} onQuickSave={onUpdate}/>))}
      </div>
    );
  };

  return(
    <div className="content-pad">
      {/* 1·3·5 权重进度条 */}
      <div className="tier-prog-bar">
        {plan.goldTask&&(
          <div className="tier-prog-group">
            <span style={{fontSize:16,marginRight:2}}>🥇</span>
            <span className={`tier-prog-pip${plan.goldTask.status==='completed'?' pip-done':''}`}>
              {plan.goldTask.status==='completed'?'✔':'○'}
            </span>
            {plan.goldTask.status==='completed'&&<span className="tier-prog-badge">已获得</span>}
          </div>

          <div className="tier-prog-group">
            <span style={{fontSize:16,marginRight:2}}>🥈</span>
            {plan.silverTasks.map((t,i)=>(
              <span key={i} className={`tier-prog-pip${t.status==='completed'?' pip-done':''}`}>{t.status==='completed'?'✔':'○'}</span>
            ))}
            {plan.silverTasks.length>0&&plan.silverTasks.every(t=>t.status==='completed')&&<span className="tier-prog-badge">已获得</span>}
          </div>
        )}
        {plan.bronzeTasks.length>0&&(
          <div className="tier-prog-group">
            <span style={{fontSize:16,marginRight:2}}>🥉</span>
            {plan.bronzeTasks.map((t,i)=>(
              <span key={i} className={`tier-prog-pip${t.status==='completed'?' pip-done':''}`}>{t.status==='completed'?'✔':'○'}</span>
            ))}
            {plan.bronzeTasks.length>0&&plan.bronzeTasks.every(t=>t.status==='completed')&&<span className="tier-prog-badge">已获得</span>}
          </div>
        )}
        <div style={{marginLeft:'auto',fontSize:11,color:'var(--text-secondary)',fontWeight:600}}>{done}/{all.length}</div>
      </div>
      {plan.goldTask&&<Sec tier="gold"   items={[plan.goldTask]}/>}
      {plan.silverTasks.length>0&&<Sec tier="silver" items={plan.silverTasks}/>}
      {plan.bronzeTasks.length>0&&<Sec tier="bronze" items={plan.bronzeTasks}/>}
      {done===all.length&&all.length>0&&(
        <div className="all-done-banner">
          <div style={{fontSize:44,marginBottom:8}}>🏆</div>
          <div style={{fontSize:19,fontWeight:800,color:'var(--gold)',marginBottom:5}}>今日任务全部完成！</div>
          <div style={{fontSize:12,color:'var(--text-secondary)'}}>太棒了，明天继续保持！</div>
        </div>
      )}
      <button className="add-task-btn" onClick={()=>setShowAddTask(true)}>➕ 新增任务</button>
      {showGoldComplete&&<GoldCompleteModal onClose={()=>setShowGoldComplete(false)}/>}
      {activeTask&&<PomodoroTimer task={activeTask} onComplete={complete} onPause={pause}/>}
      {editTask&&<EditTaskModal task={editTask} plan={plan} onSave={handleSaveEdit} onChangeTier={(t,tier)=>{onChangeTier&&onChangeTier(t,tier);setEditTask(null);}} onClose={()=>setEditTask(null)}/>}
      {showAddTask&&<AddTaskModal onSave={handleAddTask} onClose={()=>setShowAddTask(false)} plan={plan}/>}
      {deleteConfirm&&(
        <div className="overlay" onClick={()=>setDeleteConfirm(null)}>
          <div className="dialog-box" onClick={e=>e.stopPropagation()}>
            <div className="dialog-emoji">🗑️</div>
            <div className="dialog-title">删除任务</div>
            <div className="dialog-sub">确定删除「{deleteConfirm.title}」？<br/>此操作无法撤销。</div>
            <div className="dialog-row">
              <button className="dialog-btn" style={{background:'rgba(255,82,82,0.15)',color:'var(--danger)',border:'1px solid rgba(255,82,82,0.3)'}} onClick={confirmDelete}>🗑️ 删除</button>
              <button className="dialog-btn dialog-no" onClick={()=>setDeleteConfirm(null)}>取消</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}
